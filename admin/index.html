<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Armadillo Tile - Content Manager</title>
</head>
<body>
  <!-- Static CMS instead of Decap -->
  <script src="https://unpkg.com/@staticcms/app@^2.0.0/dist/static-cms-app.js"></script>
  
  <script>
    // Wait for Static CMS to load, then inject custom styles
    setTimeout(function() {
      var style = document.createElement('style');
      style.innerHTML = 
        '[class*="AppMainContainer"] { padding: 4px !important; } ' +
        '[class*="CollectionContainer"] { padding: 4px !important; } ' +
        'button { background-color: #c86c3a !important; border-radius: 8px !important; color: white !important; } ' +
        'input, textarea, select { font-size: 16px !important; } ' +
        '[class*="LoginPage"] { background-image: url(https://armadillotile.com/images/armadillobackground2.png) !important; background-repeat: repeat; }';
      document.head.appendChild(style);
      console.log('Custom styles loaded');
    }, 2000);
  </script>
</body>
</html>
