<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Armadillo Tile - Content Manager</title>
</head>
<body>
  <script src="https://unpkg.com/@staticcms/app@2.6.0/dist/static-cms-app.js"></script>
  
  <script>
    // Initialize Static CMS manually
    window.CMS.init();
    
    // Inject custom styles after initialization
    setTimeout(function() {
      var style = document.createElement('style');
      style.innerHTML = 
        'button { background-color: #c86c3a !important; color: white !important; }';
      document.head.appendChild(style);
      console.log('Custom styles loaded');
    }, 2000);
  </script>
</body>
</html>
